####################################################################
# Setup file for the test suite ONLY.
#
# The tests need a setup file that is committed to the repository and
# stable, so that a fresh clone can run them. The operational
# pytesdaq/config/setup.ini is machine local and deliberately
# untracked, and setup.ini.example_lbl marks none of its connections
# with a "tes:" field, which makes every channel classify as non-TES
# and every channel classification test vacuous.
#
# The ADC connection map below is the shape the tests rely on: four
# real TES channels on a front end board, plus a TTL input and three
# accelerometer readouts that carry no "tes:" field and must never be
# biased.
#
# Addresses and paths here are placeholders. Nothing in this file
# points at real hardware.
####################################################################


[setup]

# Facility number: 1 = McKinsey Leiden Fridge, 2 = Pyle Cryoconcept Fridge,
#                  3 = UMass
facility = 2

# Fridge run number and date/time fridge was at base temperature
# (syntax: mm/dd/yyyy HH:MM)
fridge_run = 99
fridge_run_start = 01/01/2026 00:00

# data path
data_path = /tmp/pytesdaq_test/runs

# type of instruments used
squid_controller = feb
tes_controller = feb
signal_generator = agilent33500B

# ADC list
enable_adc = adc1

# database
enable_redis = false
enable_sql = false

# readback instrument values
enable_readback = false


[adc1]

# device name
device_name = Dev1

# channel for external triggers
trigger_channel = pfi0

# default settings
sample_rate = 1250000
voltage_min = -10
voltage_max = 10

# ADC Connection Map
#
# Format: string array for each ADC channel used [0:7]
#   Controller ->  "controller:[controller_name]_[channel]"
#   TES wiring ->  "tes:[channel]" (optional if same channel name as
#                  controller channel)
#   Detector   ->  "detector:[name]" (detector channel name)
#
# connection0 to connection3 declare "tes:" and are real TES channels.
# connection4 to connection7 do not, so they classify as non-TES and
# GtaSweep must never write a bias to them.

connection0 = detector:TestTES_A, tes:A, controller:feb1_A
connection1 = detector:TestTES_B, tes:B, controller:feb1_B
connection2 = detector:TestTES_C, tes:C, controller:feb1_C
connection3 = detector:TestTES_D, tes:D, controller:feb1_D

connection4 = detector:rigolTTL, controller:ttl_ttl
connection5 = detector:AccelerometerStage2, controller:accelerometer_stage2
connection6 = detector:AccelerometerGround, controller:accelerometer_ground
connection7 = detector:AccelerometerStage1, controller:accelerometer_stage1


# Electronics and detector readout constants for each ADC connection
#
#  shunt_resistance [Ohms]
#  squid_turn_ratio
#  feedback_resistance [Ohms]
#  parasitic_resistance [Ohms]
#  tes_bias_resistance [Ohms]
#  output_gain (for close/open loop calculation)
#  preamp_gain (for open loop calculation)
#  signal_gen_resistance [Ohms] -> resistance in the TES line

detector_config0 = signal_gen_resistance:10000, shunt_resistance: 0.005, squid_turn_ratio:10, feedback_resistance:1250, parasitic_resistance:0.00183
detector_config1 = signal_gen_resistance:10000, shunt_resistance: 0.005, squid_turn_ratio:10, feedback_resistance:1250, parasitic_resistance:0.0019
detector_config2 = signal_gen_resistance:10000, shunt_resistance: 0.005, squid_turn_ratio:10, feedback_resistance:1250, parasitic_resistance:0.002
detector_config3 = signal_gen_resistance:10000, shunt_resistance: 0.005, squid_turn_ratio:10, feedback_resistance:1250, parasitic_resistance:0.00299
detector_config4 = signal_gen_resistance:10000, shunt_resistance: 1, squid_turn_ratio:1, feedback_resistance:1, parasitic_resistance:0
detector_config5 = signal_gen_resistance:10000, shunt_resistance: 1, squid_turn_ratio:1, feedback_resistance:1, parasitic_resistance:0
detector_config6 = signal_gen_resistance:10000, shunt_resistance: 1, squid_turn_ratio:1, feedback_resistance:1, parasitic_resistance:0
detector_config7 = signal_gen_resistance:10000, shunt_resistance: 1, squid_turn_ratio:1, feedback_resistance:1, parasitic_resistance:0


[polaris_daq]
lib = /tmp/pytesdaq_test/libnidaq.so
fcn = NIdaq
enable = true
next = recorder


[polaris_recorder]
lib = /tmp/pytesdaq_test/libnidaq.so
fcn = HDF5Recorder
enable = true
next = daq


[redis]
enable = false
host = 127.0.0.1
port = 6379
password = None
data_stream = NIstream


[feb]
visa_address = GPIB0::18::INSTR

# FEBs, each FEB has 4 channels (A,B,C,D)
# Format: subrack, slot
feb1 = 1,3
feb2 = 1,7

# fixed gains (total SQUID loop gain is preamp * feedback gains)
preamp_fix_gain = 1
feedback_fix_gain = 21
output_fix_gain = 1


[agilent33500B]
visa_address = GPIB::10::INSTR
attenuation = 5.01


[temperature_controllers]

# MACRT
#
# Module names
# Format:
#   macrt_modules = module1:[module name], module2:...
macrt_modules = module1:mmr3-174, module3:mgc3-66

# Individual module setup
# Format:
#   macrt_[module name] = type:[mmr3 or mgc3], ip:[X.X.X.X]
#   macrt_[module_name]_chan[0,1,2,or 3] = name:[unique name],
#                                          global_number:[unique number]
#
# The MC thermometer is labeled CP, which is what the Gab and Gta
# sweep configs reference.

# Resistance module MMR3-174 - channels are labeled 1, 2, or 3
macrt_mmr3-174_setup = type:mmr3, ip:192.168.0.31
macrt_mmr3-174_chan1 = name:MC, global_number:16, type:FR, serial:105D
macrt_mmr3-174_chan2 = name:CP, global_number:17, type:RX, serial:R654
macrt_mmr3-174_chan3 = name:Still, global_number:18, type:CX, serial:121325

# Heater MGC3-66 - channels are labeled 0, 1, or 2
macrt_mgc3-66_setup = type:mgc3, ip:192.168.0.34
macrt_mgc3-66_chan0 = name:heaterMC, global_number:31
macrt_mgc3-66_chan1 = name:heaterStill, global_number:32
