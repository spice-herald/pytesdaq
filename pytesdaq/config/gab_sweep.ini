[gab_sweep]

# DAQ driver: read_many_events requires pydaqmx
daq_driver = pydaqmx

# fridge thermometry (MC thermometer is labeled CP in the heater software)
# PID settings are never touched by this script; set them manually first
thermometer_name = CP
thermometer_instrument = macrt
heater_name = heaterMC

# TES channels (detector or TES readout names defined in setup.ini)
# the two channels must be different: one TES cannot be both devices
# both can be left at their usual operating bias; the script sets the
# thermometer to thermometer_tes_bias_uA and the heater to bias_min_uA at
# the start of the sweep, and restores both pre-run biases at shutdown
thermometer_tes_channel = A
heater_tes_channel = D

# temperature sweep: explicit vector OR start/stop/step
use_temperature_vect = true
temperature_vect_mK = 40, 38, 35, 32, 30, 27, 25, 22, 20, 16, 12
#temperature_start_mK = 42
#temperature_stop_mK = 10
#temperature_step_mK = 1

# MC temperature settling: the script polls the thermometer itself and
# waits for the setpoint to actually be reached, so a large temperature
# step simply takes longer than a small one. The reading must stay
# within temperature_tolerance_frac (fractional, 0.02 means 2 percent)
# of the setpoint for temperature_stable_time_s before the point is
# measured. On timeout the sweep continues but flags the datapoint with
# temperature_ok = False.
temperature_poll_interval_s = 5
temperature_stable_time_s = 120
temperature_max_wait_time_s = 7200
temperature_tolerance_frac = 0.07

# MC temperature per datapoint: sampled repeatedly over this window,
# then a Gaussian is fit to the histogram of samples; the fit mean is
# the recorded temperature and its sigma the uncertainty
temperature_sampling_time_s = 10

# thermometer TES bias point measurement: R0 from a square wave dIdV
# fit (didv_fit_poles, infinite loop gain approximation)
# the trace length is rounded to an integer number of signal generator
# periods; nb_events_didv traces are averaged per measurement
sample_rate_Hz = 1250000
trace_length_ms = 42
voltage_min_V = -5
voltage_max_V = 5
nb_events_didv = 500
# agreement criterion for the R0 settle only, not a target R0
r0_stability_tolerance_percent = 5

# TES circuit resistances, in mOhms, required for both channels
# thermometer: rshunt and rparasitic feed the online dIdV fit that
# extracts R0, rn sets the scale for the relock transition check
thermometer_rshunt_mOhm = 5
thermometer_rparasitic_mOhm = 3.06
thermometer_rn_mOhm = 960.45

# heater: held normal for the whole sweep, so all three are needed to
# turn its bias current into a Joule power
heater_rshunt_mOhm = 5
heater_rparasitic_mOhm = 1.87
heater_rn_mOhm = 990

# dIdV square wave on the thermometer TES
# signal_gen_voltage_mVpp is for an external signal generator; for
# magnicon use signal_gen_current_uApp instead (only one of the two
# may be set)
signal_gen_frequency_Hz = 50
signal_gen_voltage_mVpp = 8
#signal_gen_current_uApp = 5
signal_gen_offset_mV = 0
signal_gen_phase_deg = 0

# dIdV fit parameters
# didv_fcutoff_Hz is the fit lowpass cutoff
didv_fcutoff_Hz = 50000
# Two poles can avoid an unconstrained slow third pole. Default is 3.
didv_fit_poles = 3

# how to let the thermometer TES R0 settle before measuring it
# pick one method, only its own parameters are read:
#
#   use_stability_check = false -> wait a fixed settle_wait_time_s
#   use_stability_check = true  -> repeat quick R0 measurements until
#                                  the last 5 agree within
#                                  r0_stability_tolerance_percent,
#                                  giving up after stability_timeout_s
use_stability_check = false
settle_wait_time_s = 30
#nb_events_stability = 10
#stability_timeout_s = 300

# R0 drift check at startup
# repeated R0 measurements at fixed conditions before the sweep; their
# scatter is the R0 repeatability of the setup, which is the error bar
# on every point the sweep records. A warning is printed if it exceeds
# r0_stability_tolerance_percent; set drift_check_nb_measurements = 0
# to skip the check
drift_check_nb_measurements = 0
drift_check_wait_time_s = 5

# heater TES bias sweep
# bias_min_uA is the minimum current that keeps the heater TES normal
# (above its critical current); test it manually for the configured
# heater_tes_channel, it is different for each channel. It is also
# where the heater sits while the MC temperature settles, and the last
# point of every bias sweep.
bias_min_uA = 30
bias_max_uA = 150
post_bias_wait_s = 15

# the bias points, always swept descending from bias_max_uA down to
# bias_min_uA. Either give the vector explicitly (it may be typed in
# either order, it is sorted descending regardless) or give a step and
# let it be built from the endpoints. The vector must start at
# bias_max_uA and end at bias_min_uA.
#
# Nothing checks during the run that these points actually reach a
# usable R0 at every temperature. Establish that yourself with a short
# test sweep first, along with a post_bias_wait_s long enough that the
# absorber has settled at each point.
use_bias_vect = false
bias_step_uA = 12
#use_bias_vect = true
#bias_vect_uA = 800, 700, 620, 550, 490, 440, 390, 350, 310, 280, 250, 220, 200

# thermometer TES bias, held for the whole sweep. The script sets it at
# startup and every relock returns to it. Nothing checks where it lands
# in the transition, so a sweep is free to drive the thermometer normal
# over part of its heater power and bath temperature range and have
# those points cut offline.
thermometer_tes_bias_uA = 3.8

# thermometer TES relock, run with the heater at bias_max_uA, at
# startup and at the start of every temperature. The thermometer is
# driven hard normal, relocked, returned to thermometer_tes_bias_uA,
# and relocked again.
# relock_bias_uA must be well above the thermometer critical current
relock_bias_uA = 100
relock_nb_cycles = 2
